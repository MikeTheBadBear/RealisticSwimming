api-version: '1.21'
name: Realistic-Swimming
main: realisticSwimming.main.RSMain
version: '${project.version}'
description: Adds configurable swimming, falling, stamina, and armor-weight mechanics.
authors: [4a2e532e, MikeTheBadBear]
website: https://github.com/MikeTheBadBear/RealisticSwimming
softdepend: [NoCheatPlus, Glide, PlaceholderAPI]
commands:
  rs:
    permission: rs.admin.reload
    description: Reloads the Realistic Swimming configuration.
    usage: /rs reload
  swim:
    description: Enables or disables the swimming animation.
    usage: /swim <on|off>
  fall:
    description: Enables or disables the falling animation.
    usage: /fall <on|off>
permissions:
  rs.user.swim:
    default: op
  rs.user.boost:
    default: op
  rs.user.fall:
    default: op
  rs.admin.reload:
    default: op
  rs.bypass.stamina:
    default: false
