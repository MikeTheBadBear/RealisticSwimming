name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java-21:
    name: Java 21 / Paper 1.21.x
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build universal Java 21 artifact
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealisticSwimming-Java21
          path: target/RealisticSwimming-*.jar
          if-no-files-found: error

  java-25:
    name: Java 25 / Paper 26.x API check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile against the current Paper 26.x API
        run: mvn --batch-mode --no-transfer-progress -Ppaper-26 clean verify
